mujoco_sim_node:
  ros__parameters:
    sim_timestep: 0.002
    publish_rate: 500.0
    realtime_factor: 1.0
    use_viewer: true
    initial_keyframe: "home"

turtlebot_bridge_node:
  ros__parameters:
    control_rate_hz: 50.0
    laser_fov_rad: 1.2  # match object detector FOV (~69 degrees)
    laser_min_range_m: 0.05
    laser_max_range_m: 2.0
    lidar_noise_sigma0_m: 0.01
    lidar_noise_scale: 0.01
    lidar_dropout_prob: 0.02

object_detector_node:
  ros__parameters:
    detection_rate_hz: 5.0
    detection_range_m: 1.0
    detection_fov_rad: 1.2  # ~69 degrees (camera FOV)
    position_noise_sigma_m: 0.05
    false_negative_prob: 0.05

navigator_node:
  ros__parameters:
    control_rate_hz: 20.0
    goal_tolerance_m: 0.05
    goal_tolerance_rad: 0.1
    max_linear_vel: 4.0
    max_angular_vel: 6.0
    kp_angular: 4.0
    lookahead_m: 0.35
